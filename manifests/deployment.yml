apiVersion : apps/v1
kind: Deployment
metadata:
  name: ufo-redis 
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ufo-redis
  template:
    metadata:
      labels:
        app: ufo-redis 
    spec:
      containers:
        - name: ufo-redis 
          image: DOCKER_IMAGE
          ports:
          - containerPort: 6379
          resources:
            limits:
              memory: "1Gi"
              cpu: "800m"
            requests:
              memory: "256Mi"
              cpu: "500m"
#          envFrom:
#            - secretRef:
#                name: ufo-redis-env
          livenessProbe: 
            enabled: true 
            initialDelaySeconds: 5 
            periodSeconds: 5 
            timeoutSeconds: 5 
            successThreshold: 1 
            failureThreshold: 5 
          readinessProbe: 
            enabled: true 
            initialDelaySeconds: 5 
            periodSeconds: 5 
            timeoutSeconds: 1 
            successThreshold: 1 
            failureThreshold: 5 